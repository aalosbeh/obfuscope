[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "obfuscope"
version = "1.0.0"
description = "Malware-agnostic obfuscation-toolchain provenance and open-set recognition at HTC scale"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anas Alsobeh"}]
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "pandas>=2.2",
  "scikit-learn>=1.5", "matplotlib>=3.8", "pyarrow>=15",
]

[tool.setuptools.packages.find]
where = ["src"]
